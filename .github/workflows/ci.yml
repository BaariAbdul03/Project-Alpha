name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Build-only placeholders: no backend is contacted during `next build`.
      NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: pk_ci_build_placeholder
      NEXT_PUBLIC_MEDUSA_BACKEND_URL: http://127.0.0.1:9000
      NEXT_PUBLIC_DEFAULT_REGION: in
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: npm audit (informational, known outstanding advisories)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
